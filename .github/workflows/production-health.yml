name: Production health
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production /api/health
        run: |
          set -euo pipefail
          URL="${PRODUCTION_HEALTH_URL:-https://fortifymeai.vercel.app/api/health}"
          code=$(curl -sS -o /tmp/fortifymeai-health.json -w "%{http_code}" --max-time 30 "$URL" || true)
          echo "HTTP $code"
          if [ "$code" = "404" ]; then
            echo "WARN: /api/health not on production yet (deploy from branch that serves vercel.app). Not failing cron."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Unexpected status $code"
            cat /tmp/fortifymeai-health.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/fortifymeai-health.json"))
          print(json.dumps(data, indent=2))
          if data.get("ok") is not True or data.get("service") != "fortifymeai":
              sys.exit("production health probe failed")
          PY
