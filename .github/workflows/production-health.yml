name: Production health
on:
  schedule:
    # Every 6 hours — actionable failure emails go to repo watchers.
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production /api/health
        run: |
          set -euo pipefail
          URL="${PRODUCTION_HEALTH_URL:-https://fortifymeai.vercel.app/api/health}"
          curl -fsS --max-time 30 "$URL" -o /tmp/fortifymeai-health.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/fortifymeai-health.json"))
          print(json.dumps(data, indent=2))
          if data.get("ok") is not True or data.get("service") != "fortifymeai":
              sys.exit("production health probe failed")
          PY
